        - generic [ref=e139]:
          - heading "BioCatch Align and Fraud Telemetry Collection" [level=1] [ref=e140]
          - paragraph [ref=e141]:
            - generic [ref=e142]:
              - text: Thousands of application, behavioral, device, network, and transactional signals are collected from each of the billions of user sessions we analyze every month via BioCatch Align
              - superscript [ref=e144]: TM
              - text: . This invaluable amount of data lives at the core of all our solutions, enabling their unique ability to differentiate between good and bad, and provide accurate risk assessments. The fraud telemetry collection effortlessly scales to tens of millions of users, matching the needs of any customer, located anywhere on earth.
    - generic [ref=e155]:
      - heading "Continuous Behavioral Sequencing" [level=1] [ref=e156]
      - paragraph [ref=e157]:
        - generic [ref=e158]: Continuous Behavioral Sequencing leverages advanced cognitive science and both machine learning and deep learning algorithms to parse, match, synthesize, and score every element of data collected by BioCatch Align. Anomalies and deviations in a user’s normal behavior — such as abnormal navigation, the presence of remote access tools, unusual typing cadence, an active phone call, and thousands of other indicators — synthesized with application, device, network and transactional signals differentiate between a genuine user, a fraudster, or a known user under duress. Individuals’ needs and behavioral changes are reflected in our analysis, based on the contextual data, and utilized by BioCatch’s fraud and financial crime solutions to produce highly-accurate recognition of users and their and intent by identifying behaviors as legitimate, permanent, or fraudulent.
  - generic [ref=e166]:
    - heading "Predictive fraud and financial crime intelligence" [level=1] [ref=e167]
    - paragraph [ref=e168]: As BioCatch continues to innovate and build the latest predictive fraud and financial crime models, we see data collection, consumption, and output sharing as top priorities. Once the appropriate data has been collected and synthesized by BioCatch Align and Continuous Behavioral Sequencing engine, it is fed to the appropriate solution analysis modules to generate outputs, such as threat indicators, risk and genuine factors, risk scores, and unique data points. These outputs are then visualized and made interactive with our advanced investigation tools.
  - generic [ref=e180]:
    - heading "Investigative analysis and visualization tooling" [level=1] [ref=e181]
    - paragraph [ref=e183]:
      - generic [ref=e184]: Real-time decision making is paramount to seeing and stopping fraud and financial crime before funds are transferred, and customers become victims. Powered by our unique threat indicators, risk and genuine factors, risk scores, and unique data points, BioCatch investigative analysis and visualization tools such BioCatch Link, Analyst Station, Rule Manager, Insights Query Engine, and Push API allow fraud, financial crime, and cyber teams to quickly identify, investigate, and act to stop fraud.
    - paragraph [ref=e185]:
      - img "BioCatch_PI_Icons" [ref=e187]
    - paragraph [ref=e188]
  - generic [ref=e197]:
    - heading "BioCatch’s professional services and support" [level=2] [ref=e198]
    - paragraph [ref=e200]:
      - generic [ref=e201]: BioCatch’s professional services and support model is designed to deliver measurable value at every stage of engagement. Our global solutions team brings together top-tier experts who provide subject matter expertise, thought leadership, regional insights, and industry-best practices to drive positive business outcomes. Threat analysts, engagement managers, and solutions engineers partner with customers to apply multi-threaded fraud telemetry and behavioral intelligence expertise at no additional cost. From fraud consulting and model optimization to integration support and strategic guidance, each role helps ensure maximum solution performance and ongoing operational excellence.
