# JPA configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/creditdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${USER}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Get BE (error, info, and other) messages to the FE
# The server throws the error message to the client
# The message can be viewed in the Network -> Response tab
server.error.include-message=never
server.error.include-binding-errors=always
server.port=${SERVER_PORT:8081}

# Security (authentication / authorization basics)
nexcredit.security.jwt-secret=${JWT_SECRET:nexcredit-dev-secret-change-me-in-production-0123456789abcd}
nexcredit.cors.allowed-origins=http://localhost:3000,http://localhost:3001
nexcredit.security.jwt-expiration-ms=3600000
nexcredit.security.users=underwriter:underwriter123:UNDERWRITER;admin:admin123:ADMIN;applicant:applicant123:APPLICANT

# AI layer (OpenAI-compatible). Default provider is Groq (free tier, fast).
# Activate LLM explanations with: NEXCREDIT_AI_ENABLED=true + OPENAI_API_KEY=<groq key>
nexcredit.ai.enabled=true
nexcredit.ai.base-url=${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
nexcredit.ai.embedding-base-url=${NEXCREDIT_EMBEDDING_BASE_URL:https://api.groq.com/openai/v1}
# LLM provider (Groq or any OpenAI-compatible endpoint).
# Set OPENAI_API_KEY in your environment, or place overrides in application-local.properties
# (git-ignored). NEVER commit a real key.
spring.config.import=optional:classpath:application-local.properties
nexcredit.ai.api-key=${OPENAI_API_KEY:}
nexcredit.ai.chat-model=${NEXCREDIT_CHAT_MODEL:openai/gpt-oss-120b}
# Groq has no embeddings endpoint; embeddings fall back to the local deterministic model.
# Point NEXCREDIT_EMBEDDING_BASE_URL at a provider with embeddings (e.g. Together.ai / Gemini) for real vectors.
nexcredit.ai.embedding-model=${NEXCREDIT_EMBEDDING_MODEL:text-embedding-3-small}
nexcredit.ai.embedding-dim=1536

# ML risk model (real logistic-regression scorer trained on synthetic NTC data at startup)
nexcredit.ai.ml-enabled=${NEXCREDIT_ML_ENABLED:true}

# Vector store (pgvector). Requires the vector extension in PostgreSQL.
nexcredit.vector.enabled=${NEXCREDIT_VECTOR_ENABLED:true}
